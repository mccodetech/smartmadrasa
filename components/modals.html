<!-- ========================================== -->
<!-- 1. Edit Madrasa Modal (Super Admin Pop-up) -->
<!-- ========================================== -->
<div class="modal fade" id="editMadrasaModal" tabindex="-1" aria-labelledby="editMadrasaModalLabel" aria-hidden="true" style="z-index: 1060;">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header bg-success text-white rounded-top-4">
        <h5 class="modal-title fw-bold" id="editMadrasaModalLabel">
          <i class="fa-solid fa-pen-to-square me-2"></i>Edit Madrasa Details
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <input type="hidden" id="editMadrasaDocId">
        
        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary">Short Code / ID</label>
          <input type="text" class="form-control" id="editMadrasaShortCode" placeholder="e.g. MD01">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary">Madrasa Name</label>
          <input type="text" class="form-control" id="editMadrasaName" placeholder="Madrasa Name">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary">Admin Name</label>
          <input type="text" class="form-control" id="editMadrasaAdminName" placeholder="Admin Name">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary">Phone Number</label>
          <input type="text" class="form-control" id="editMadrasaPhone" placeholder="Phone Number">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary">Email Address</label>
          <input type="email" class="form-control" id="editMadrasaEmail" placeholder="Email Address">
        </div>
      </div>
      <div class="modal-footer bg-light border-0 rounded-bottom-4">
        <button type="button" class="btn btn-secondary px-4 rounded-3" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success px-4 rounded-3" onclick="window.saveEditedMadrasaDetails()">
          <i class="fa-solid fa-check me-1"></i> Save Changes
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ========================================== -->
<!-- 2. Custom Task Modal (Performance Points) -->
<!-- ========================================== -->
<div class="modal fade" id="customTaskModal" tabindex="-1" aria-labelledby="customTaskModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="customTaskForm" onsubmit="saveCustomTask(event)">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="customTaskModalLabel"><i class="fa-solid fa-star me-2"></i>Add Custom Task</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-bold">Task Name</label>
            <input type="text" id="customTaskName" class="form-control text-uppercase" placeholder="e.g. QURAN MEMORIZATION" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Points (Pts)</label>
            <input type="number" id="customTaskPoints" class="form-control" placeholder="e.g. 10" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success px-4">Save Task</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ========================================== -->
<!-- 3. Committee Member Modal                 -->
<!-- ========================================== -->
<div class="modal fade" id="committeeModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="committeeForm" onsubmit="saveCommitteeMember(event)">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title fw-bold">Add Committee Member</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label small fw-bold">Full Name *</label>
            <input type="text" id="commName" class="form-control text-uppercase" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Designation (പദവി) *</label>
            <input type="text" id="commDesignation" class="form-control text-uppercase" placeholder="e.g. President, Secretary" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Phone Number *</label>
            <input type="tel" id="commPhone" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Upload Photo (ഫോട്ടോ തിരഞ്ഞെടുക്കുക)</label>
            <input type="file" id="commPhotoFile" class="form-control" accept="image/*">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save Member</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ========================================== -->
<!-- 4. Fee Payment Modal                      -->
<!-- ========================================== -->
<div class="modal fade" id="feePaymentModal" tabindex="-1" aria-labelledby="feePaymentModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="feePaymentForm" onsubmit="saveFeePayment(event)">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="feePaymentModalLabel"><i class="fa-solid fa-indian-rupee-sign me-2"></i>Collect Fee</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="payStudentId">
          <input type="hidden" id="payStudentReg">
          <input type="hidden" id="payStudentName">
          <input type="hidden" id="payStudentClass">
          <input type="hidden" id="payStudentPhone">
          <input type="hidden" id="payBaseFee">

          <div class="mb-3">
            <label class="form-label fw-bold text-muted">Student Name</label>
            <div id="payStudentNameDisplay" class="form-control bg-light fw-bold text-dark"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Academic Year</label>
            <select id="payAcademicYear" class="form-select">
              <option value="2026-2027" selected>2026-2027</option>
              <option value="2025-2026">2025-2026</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Fee Category</label>
            <select id="pagesFeeCategory" class="form-select" onchange="toggleFeeCategoryOptions()">
              <option value="Monthly Fee">Monthly Fee</option>
              <option value="Special Fee / Fund">Special Fee / Fund</option>
              <option value="Admission Fee">Admission Fee</option>
              <option value="Exam Fee">Exam Fee</option>
            </select>
          </div>

          <div class="mb-3" id="monthSelectionDiv">
            <label class="form-label fw-bold">Select Months</label>
            <div class="d-flex flex-wrap gap-2 p-2 border rounded bg-light">
              <div class="form-check"><input class="form-check-input month-cb" type="checkbox" value="APR" id="m_apr" checked onchange="calculateFeeAmount()"><label class="form-check-label" for="m_apr">APR</label></div>
              <div class="form-check"><input class="form-check-input month-cb" type="checkbox" value="MAY" id="m_may" checked onchange="calculateFeeAmount()"><label class="form-check-label" for="m_may">MAY</label></div>
              <div class="form-check"><input class="form-check-input month-cb" type="checkbox" value="JUN" id="m_jun" checked onchange="calculateFeeAmount()"><label class="form-check-label" for="m_jun">JUN</label></div>
              <div class="form-check"><input class="form-check-input month-cb" type="checkbox" value="JUL" id="m_jul" checked onchange="calculateFeeAmount()"><label class="form-check-label" for="m_jul">JUL</label></div>
              <div class="form-check"><input class="form-check-input month-cb" type="checkbox" value="AUG" id="m_aug" checked onchange="calculateFeeAmount()"><label class="form-check-label" for="m_aug">AUG</label></div>
              <div class="form-check"><input class="form-check-input month-cb" type="checkbox" value="SEP" id="m_sep" checked onchange="calculateFeeAmount()"><label class="form-check-label" for="m_sep">SEP</label></div>
              <div class="form-check"><input class="form-check-input month-cb" type="checkbox" value="OCT" id="m_oct" checked onchange="calculateFeeAmount()"><label class="form-check-label" for="m_oct">OCT</label></div>
              <div class="form-check"><input class="form-check-input month-cb" type="checkbox" value="NOV" id="m_nov" checked onchange="calculateFeeAmount()"><label class="form-check-label" for="m_nov">NOV</label></div>
              <div class="form-check"><input class="form-check-input month-cb" type="checkbox" value="DEC" id="m_dec" checked onchange="calculateFeeAmount()"><label class="form-check-label" for="m_dec">DEC</label></div>
              <div class="form-check"><input class="form-check-input month-cb" type="checkbox" value="JAN" id="m_jan" checked onchange="calculateFeeAmount()"><label class="form-check-label" for="m_jan">JAN</label></div>
              <div class="form-check"><input class="form-check-input month-cb" type="checkbox" value="FEB" id="m_feb" checked onchange="calculateFeeAmount()"><label class="form-check-label" for="m_feb">FEB</label></div>
              <div class="form-check"><input class="form-check-input month-cb" type="checkbox" value="MAR" id="m_mar" checked onchange="calculateFeeAmount()"><label class="form-check-label" for="m_mar">MAR</label></div>
            </div>
          </div>

          <div class="mb-3 d-none" id="specialFeeTypeDiv">
            <label class="form-label fw-bold">Select Fund Type</label>
            <select id="paySpecialFeeSelect" class="form-select"></select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Total Amount (₹)</label>
            <input type="number" id="payAmount" class="form-control fw-bold text-success fs-5" readonly>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Manual Receipt No (Optional)</label>
            <input type="text" id="payManualReceiptInput" class="form-control" placeholder="Enter manual receipt number if any">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success px-4"><i class="fa-solid fa-check me-1"></i> Save & Print Receipt</button>
        </div>
      </form>
    </div>
  </div>
</div>
